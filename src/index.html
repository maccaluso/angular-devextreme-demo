<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AngularDevextremeDemo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!--
    Due fogli di stile completi (bundle "theme-light"/"theme-dark" in
    angular.json, con "inject": false — non li aggiunge Angular in
    automatico), ognuno caricato SOLO se il proprio media query
    corrisponde alla preferenza del sistema operativo dell'utente.
    Nessun toggle, nessuna classe, nessun JS: il browser stesso attiva
    l'uno o l'altro, e li rivaluta dal vivo se l'utente cambia
    impostazione mentre la pagina è aperta. "light" copre anche il caso
    "nessuna preferenza espressa" — è il comportamento di default della
    media feature "prefers-color-scheme".
  -->
  <link rel="stylesheet" href="theme-light.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="theme-dark.css" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
</head>
<body>
  <app-root></app-root>
</body>
</html>
