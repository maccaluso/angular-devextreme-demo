<header class="app-header">
  <div class="page app-header__inner">
    <h1>{{ title() }}</h1>
    <p>
      Stesso tema dati "task" del resto del ripasso, questa volta con componenti
      <strong>DevExtreme</strong> reali al posto di HTML+CSS scritto a mano.
    </p>

    <!--
      dx-tabs come menu di navigazione: `items` sono oggetti qualsiasi (qui
      { text, path }), `selectedIndex` tiene il tab allineato con la rotta
      corrente (vedi selectedIndex in app.ts), `onItemClick` è dove
      trasformiamo il click DevExtreme in una vera navigazione Angular.
    -->
    <dx-tabs
      class="app-nav"
      [items]="navItems"
      keyExpr="path"
      [selectedIndex]="selectedIndex()"
      stylingMode="secondary"
      (onItemClick)="onTabClick($event)"
    ></dx-tabs>
  </div>
</header>

<main class="page">
  <router-outlet></router-outlet>
</main>
